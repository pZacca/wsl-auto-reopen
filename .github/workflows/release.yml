name: Release

# Pushing a tag like v0.2.0 publishes that version. The tag must match the version in package.json;
# the job refuses otherwise.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Each registry is published to only when its token is set. Without VSCE_PAT (it needs an Azure DevOps
    # organization, which needs an Azure subscription), upload the .vsix from the GitHub release by hand.
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check that the tag matches package.json
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "vsix=wsl-auto-reopen-$version.vsix" >> "$GITHUB_OUTPUT"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - run: npm run smoke
      # Both registries and the GitHub release get the same .vsix.
      - if: env.VSCE_PAT != ''
        run: npx vsce publish --allow-star-activation --packagePath "${{ steps.version.outputs.vsix }}"
      - if: env.VSCE_PAT == ''
        run: echo "::notice::VSCE_PAT is not set. Upload ${{ steps.version.outputs.vsix }} from the GitHub release at https://marketplace.visualstudio.com/manage/publishers/zacca"
      - if: env.OVSX_PAT != ''
        run: npx ovsx publish "${{ steps.version.outputs.vsix }}"
      - if: env.OVSX_PAT == ''
        run: echo "::notice::OVSX_PAT is not set, so ${{ steps.version.outputs.vsix }} was not published to Open VSX."
      - run: gh release create "$GITHUB_REF_NAME" "${{ steps.version.outputs.vsix }}" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check that the tag matches package.json
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "vsix=wsl-auto-reopen-$version.vsix" >> "$GITHUB_OUTPUT"
      - run: npm test
      - run: npm run package
      # Both registries and the GitHub release get the same .vsix.
      - run: npx vsce publish --allow-star-activation --packagePath "${{ steps.version.outputs.vsix }}"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - run: npx ovsx publish "${{ steps.version.outputs.vsix }}"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
      - run: gh release create "$GITHUB_REF_NAME" "${{ steps.version.outputs.vsix }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
